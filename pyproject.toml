[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bitmagnet-classify"
version = "0.1.0"
description = "bitmagnet remote ML/filter classifier service"
dependencies = [
    "fastapi",
    "fasttext",
    "httpx",
    "numpy",
    "onnxruntime",
    "transformers",
    "uvicorn",
]

[project.scripts]
bitmagnet-classify = "bitmagnet_classify.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bitmagnet_classify*"]
