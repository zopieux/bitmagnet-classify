[package]
name = "bitmagnet-classify"
version = "0.1.0"
edition = "2024"

[features]
default = []
batch = ["dep:csv", "dep:rayon"]

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ort = { version = "2.0.0-rc.14", default-features = false, features = ["load-dynamic", "ndarray", "std"] }
ndarray = "0.17"
ndarray-npy = { version = "0.10.0", default-features = false, features = ["npz"] }
tokenizers = "0.23"
whatlang = "0.18"
fasttext-pure-rs = "0.1.0"
regex = "1.11"
fancy-regex = "0.19"
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
parking_lot = "0.12"
form_urlencoded = "1.2"
libc = "0.2"
csv = { version = "1.3", optional = true }
rayon = { version = "1.12", optional = true }

[dev-dependencies]
csv = "1.3"

[[bin]]
name = "bitmagnet-classify"
path = "src/main.rs"

[[bin]]
name = "reclassify"
path = "src/bin/reclassify.rs"
required-features = ["batch"]
